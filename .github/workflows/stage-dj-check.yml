name: Stage and DJ equipment checks
on: [push, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux development dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev lld
      - name: Check build
        run: cargo check
      - name: Test stage and gallery navigation
        run: cargo test
      - name: Build executable
        run: cargo build
      - name: Install software graphics dependencies
        run: sudo apt-get install -y --no-install-recommends xvfb xdotool libxkbcommon-x11-0 mesa-vulkan-drivers x11-apps
      - name: Exercise stage and capture game
        run: |
          BEVY_ASSET_ROOT="$PWD" xvfb-run -a -s '-screen 0 1440x900x24' bash -c '
            target/debug/moonchild-3d >/tmp/moonchild.log 2>&1 & game=$!
            sleep 60
            if ! kill -0 "$game" 2>/dev/null; then cat /tmp/moonchild.log; exit 1; fi
            win=$(xdotool search --name "MOONCHILD" | head -n1)
            xdotool windowfocus "$win" keydown Shift_L keydown w
            sleep 25
            xdotool keyup Shift_L keyup w
            xdotool key space keydown w
            sleep 5
            xdotool keyup w mousemove 700 400 mousedown 3 mousemove_relative --sync -- 0 250
            sleep 3
            xdotool mouseup 3
            sleep 30
            xwd -silent -root | gzip -1 | base64 -w 0
            echo
            echo GAME_LOG_BEGIN
            cat /tmp/moonchild.log
            echo GAME_LOG_END
            if grep -E "Path not found:|panicked at" /tmp/moonchild.log; then kill "$game"; exit 1; fi
            kill "$game"
          '
